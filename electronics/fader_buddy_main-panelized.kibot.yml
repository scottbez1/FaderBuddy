# KiBot config for the panelized fader_buddy_main board (see
# fader_buddy_main-kikit_panelize.json). Only renders are generated here --
# schematic/BOM/iBOM outputs come from the single-board fader_buddy_main.kibot.yml.
kibot:
  version: 1

global:
  # Force pcb-based filenames (%bf), since the panel is generated into
  # electronics/build/ rather than living alongside the project
  output: '%bf-%i%I%v.%x'

preflight:
  check_zone_fills: true
  # DRC is run against the single (unpanelized) board; the panel geometry is
  # generated by kikit and checked as part of the kikit fab step.
  run_drc: false
  run_erc: false
  set_text_variables:
    - name: COMMIT_DATE_LONG
      command: 'python3 ci/util/rev_info.py git_date'
    - name: COMMIT_DATE
      command: 'python3 ci/util/rev_info.py git_date --short'
    - name: COMMIT_HASH
      command: 'python3 ci/util/rev_info.py git_short_rev'
    - name: RELEASE_VERSION
      command: 'python3 ci/util/rev_info.py git_release_version releases/electronics/'

outputs:
  - name: 3d
    type: render_3d
    options:
      view: 'top'
      copper: '#B39C00FF'
      board: '#E0D39CA1'
      solder_mask: '#0B0B0BD4'
      zoom: 3
      orthographic: true
      ray_tracing: true
      height: 1024
      width: 1024

  - name: 3d_back
    type: render_3d
    extends: 3d
    options:
      view: 'bottom'
