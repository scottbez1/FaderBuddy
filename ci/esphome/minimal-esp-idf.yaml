# Smallest config that pulls in the whole fader_buddy component, built by CI
# (.github/workflows/esphome.yml) alongside the full example.
#
# Covers what the example doesn't:
# - ESP-IDF, ESPHome's default ESP32 framework since 2026.7. The example pins
#   Arduino, so without this an Arduino-only API in the component would only
#   break for users on the default.
# - firmware: none, the opt-out path for the packaged fader firmware image.
# - A plain ESP32 rather than the example's S3.
esphome:
  name: fader-buddy-ci-minimal

esp32:
  board: esp32dev

logger:

i2c:
  sda: GPIO21
  scl: GPIO22

external_components:
  - source:
      type: local
      path: ../../esphome/components
    components: [fader_buddy]

fader_buddy:
  - id: fader_buddy_ci
    address: 0x20
    firmware: none
