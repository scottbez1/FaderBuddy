# CI-only config (.github/workflows/esphome.yml): the fader_buddy component on
# ESP-IDF, with no packaged firmware.
#
# Covers what minimal-arduino.yaml doesn't:
# - ESP-IDF, ESPHome's default ESP32 framework since 2026.7. The example pins
#   Arduino, so without this an Arduino-only API in the component would only
#   break for users on the default.
# - firmware: none, the opt-out path for the packaged fader firmware image.
# - A plain ESP32 rather than an S3.
esphome:
  name: fader-buddy-ci-minimal

esp32:
  board: esp32dev

logger:

i2c:
  sda: GPIO21
  scl: GPIO22

external_components:
  - source:
      type: local
      path: ../../esphome/components
    components: [fader_buddy]

fader_buddy:
  - id: fader_buddy_ci
    address: 0x20
    firmware: none
