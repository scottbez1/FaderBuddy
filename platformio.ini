; PlatformIO Project Configuration File

[platformio]
src_dir = firmware/src
lib_dir = firmware/lib
include_dir = firmware/include
test_dir = firmware/test
data_dir = firmware/data


; ---------------------------------------------------------------------------
; Boot section layout (keep in sync with firmware/src/shared/bootloader_protocol.h)
;
;   BOOTEND = 0x08  ->  boot section = 0x08 * 256 = 0x800 bytes
;   The application is linked to start at 0x800 and runs after the bootloader.
; When the measured bootloader size settles, shrink BOOTEND here, in
; bootloader_protocol.h (BL_BOOTEND), and the fuse value together.
; ---------------------------------------------------------------------------


; ===========================================================================
; Application, standalone at flash 0x0000 (no bootloader).
; The original/legacy build: flash via UPDI, runs on its own. Kept for boards
; without a bootloader and for quick iteration when the boot section is absent.
; ===========================================================================
[env:fb_legacy_no_bootloader]
platform = atmelmegaavr
board = ATtiny1616
framework = arduino
extra_scripts =
	firmware/tools/install_pyupdi.py
	firmware/tools/erase_target.py
upload_speed = 115200
upload_port = /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
monitor_speed = 115200
monitor_port = /dev/ttyUSB1
board_build.f_cpu = 20000000L
upload_flags =
	-d
	attiny1616
	-c
	$UPLOAD_PORT
	-b
	$UPLOAD_SPEED
upload_command = pyupdi $UPLOAD_FLAGS -f $SOURCE
build_src_filter = +<*> -<bootloader/>
lib_deps =
	https://github.com/lacklustrlabs/Arduino-PID-Library.git#4f38652f30c06257fe2cafc33eb8066457dce0de
	https://github.com/MX682X/ptc_touch.git#651db78f89633a35cd5412c481c631c2e74c9307
build_flags =
 -DARDUINO_AVR_ATtiny1616
 -DPRODUCT_CODE=1234
 -DCONFIG_I2C_PERIPH_ADDR=0x50

 -DCONFIG_ADDR_0_PIN=PIN_PC2
 -DCONFIG_ADDR_1_PIN=PIN_PC1
 -DCONFIG_ADDR_2_PIN=PIN_PC0

 -DCONFIG_CUSTOM_HOOKS=1


; ===========================================================================
; Application, built to run at the post-boot offset (0x800), for use WITH the
; I2C bootloader. This is both the day-to-day dev-iteration build (re-flash the
; app over UPDI without disturbing the installed bootloader) and the source of
; the application image that the host streams over I2C.
;
;  - USING_OPTIBOOT: skips megaTinyCore's .init3 reset-flag handling (which
;    would otherwise force a software reset when the bootloader jumps in with
;    the reset flags already cleared) and leaves IVSEL at its reset default so
;    the interrupt vectors resolve at the application section start.
;  - --section-start=.text=0x800: link .text (and the vector table) at 0x800.
;
; Upload does NOT chip-erase and does NOT touch fuses, so an already-installed
; bootloader and its BOOTEND/APPEND fuses are preserved.
; ===========================================================================
[env:fb_app_only]
extends = env:fb_legacy_no_bootloader
extra_scripts =
	firmware/tools/install_pymcuprog.py
	firmware/tools/erase_target.py
upload_command = $PYTHONEXE $PROJECT_DIR/firmware/tools/flash_with_fuses.py --port $UPLOAD_PORT --hex $SOURCE
; The platform's base builder links .text at board_build.text_section_start
; (default 0x0). Point it at the boot offset so .text and the vector table land
; at 0x800 -- must equal BOOTEND*256 (see bootloader_protocol.h / this file's header).
board_build.text_section_start = 0x800
build_flags =
 ${env:fb_legacy_no_bootloader.build_flags}
 -DUSING_OPTIBOOT


; ===========================================================================
; The I2C bootloader itself: bare-metal (no Arduino framework), linked into the
; boot section at 0x0000. Uploading installs it AND sets the BOOTEND/APPEND
; fuses via a chip-erasing UPDI write (this wipes any existing application;
; re-flash the app afterward with env:fb_app_only, or use env:
; fb_app_and_bootloader to do both at once).
; ===========================================================================
[env:fb_bootloader_only]
platform = atmelmegaavr
board = ATtiny1616
extra_scripts =
	firmware/tools/install_pymcuprog.py
	firmware/tools/erase_target.py
upload_port = /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
board_build.f_cpu = 20000000L
build_src_filter = -<*> +<bootloader/>
upload_command = $PYTHONEXE $PROJECT_DIR/firmware/tools/flash_with_fuses.py --port $UPLOAD_PORT --erase --hex $SOURCE --bootend 0x08 --append 0x00


; ===========================================================================
; Combined "factory" flash: install the bootloader + the offset application +
; the fuses in a single chip-erasing UPDI upload onto a blank chip. This is the
; one-time bring-up path and the recovery path if a board's app is ever left
; invalid. Build the bootloader first (pio run -e fb_bootloader_only), then:
;   pio run -e fb_app_and_bootloader -t upload
; ===========================================================================
[env:fb_app_and_bootloader]
extends = env:fb_app_only
extra_scripts =
	firmware/tools/install_pymcuprog.py
	firmware/tools/erase_target.py
upload_command = $PYTHONEXE $PROJECT_DIR/firmware/tools/flash_with_fuses.py --port $UPLOAD_PORT --erase --hex $PROJECT_DIR/.pio/build/fb_bootloader_only/firmware.hex --hex $SOURCE --bootend 0x08 --append 0x00
