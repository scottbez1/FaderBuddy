name: ESPHome

# Compiles the fader_buddy external component under a pinned ESPHome, so a C++
# or config-validation error in the component fails CI instead of a user's build.
#
# The configs are CI-only and contain just the component (ci/esphome/*.yaml), not
# esphome/examples/: the example also exercises display and LVGL options that
# ESPHome changes from release to release, which would break this job for reasons
# that have nothing to do with the component.

on:
  push:
    branches: [master]
    paths:
      - 'esphome/**'
      - 'ci/esphome/**'
      - '.github/workflows/esphome.yml'
  pull_request:
    paths:
      - 'esphome/**'
      - 'ci/esphome/**'
      - '.github/workflows/esphome.yml'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same PR supersedes the run in flight; master runs all finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  compile:
    name: Compile ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    strategy:
      # Report every config, not just the first to fail.
      fail-fast: false
      matrix:
        include:
          - name: ESP32-S3, Arduino, packaged firmware
            config: ci/esphome/minimal-arduino.yaml
          - name: ESP32, ESP-IDF, firmware none
            config: ci/esphome/minimal-esp-idf.yaml

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ci/esphome/requirements.txt

      - name: Install ESPHome
        run: pip install -r ci/esphome/requirements.txt

      - name: Cache toolchains and build
        uses: actions/cache@v4
        with:
          # ~/.cache/esphome: native ESP-IDF toolchains and ccache (ESPHome >= 2026.7);
          # ~/.platformio: the Arduino build; **/.esphome: build dirs and downloads.
          path: |
            ~/.cache/esphome
            ~/.platformio
            ${{ github.workspace }}/**/.esphome
          key: esphome-${{ runner.os }}-${{ hashFiles('ci/esphome/requirements.txt') }}-${{ matrix.config }}-${{ hashFiles(matrix.config) }}
          restore-keys: |
            esphome-${{ runner.os }}-${{ hashFiles('ci/esphome/requirements.txt') }}-${{ matrix.config }}-

      - name: Validate config
        # Prints the resolved config, errors included.
        run: esphome config ${{ matrix.config }}

      - name: Compile
        run: esphome compile ${{ matrix.config }}
