name: Firmware

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-firmware:
    name: Build ATtiny1616 firmware
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Build bootloader
        run: pio run -e fb_bootloader_only

      - name: Build application (standalone and offset)
        run: pio run -e fb_legacy_no_bootloader -e fb_app_only

      # Names the .bin after the FW_VERSION baked into it, and -- on a release tag --
      # fails if that disagrees with the tag, so a mislabelled asset can't be published,
      # then writes the manual `gh release create` walkthrough to the job summary.
      # Releases are cut by hand, so this workflow never needs write access to the repo.
      - name: Package release image
        run: |
          ./ci/firmware/package_release.py --no-build \
            ${{ startsWith(github.ref, 'refs/tags/releases/firmware/') && format('--expect-version {0}', github.ref) || '' }}

      - name: Archive artifacts
        uses: actions/upload-artifact@v4.6.0
        if: always()
        with:
          name: firmware
          path: |
            firmware/build/*.bin
            .pio/build/fb_app_only/firmware.hex
            .pio/build/fb_bootloader_only/firmware.hex

  build-jig:
    name: Build production jig firmware
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      # The ESP32 toolchain and libraries are the slow part of this job.
      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-jig-${{ runner.os }}-${{ hashFiles('platformio.ini', 'production_tools/programAndTest/platformio.ini') }}
          restore-keys: |
            pio-jig-${{ runner.os }}-

      # Only the production test firmware; env:lab (the control-loop tuning
      # harness) is deliberately not built. Its pre-build hook builds
      # env:fb_app_only from the repo root and embeds the result, so this also
      # covers the jig's image generation.
      - name: Build jig (env:lilygo-t-display)
        run: pio run -d production_tools/programAndTest -e lilygo-t-display

      - name: Archive artifacts
        uses: actions/upload-artifact@v4.6.0
        if: always()
        with:
          name: jig-firmware
          path: production_tools/programAndTest/.pio/build/lilygo-t-display/firmware.bin
