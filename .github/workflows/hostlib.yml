name: Host library

# Native unit tests for hostLib/ against a simulated fader, and a compile of
# its Arduino example as a consumer would build it.

on:
  push:
    branches: [master]
    paths:
      - 'hostLib/**'
      - 'firmware/src/shared/**'
      - '.github/workflows/hostlib.yml'
  pull_request:
    paths:
      - 'hostLib/**'
      - 'firmware/src/shared/**'
      - '.github/workflows/hostlib.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Native tests and Arduino example
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-hostlib-${{ runner.os }}-${{ hashFiles('hostLib/platformio.ini') }}
          restore-keys: |
            pio-hostlib-${{ runner.os }}-

      - name: Native unit tests
        run: pio test -d hostLib -e native

      - name: Build Arduino example
        run: pio ci hostLib/examples/basic --lib hostLib --board esp32dev
