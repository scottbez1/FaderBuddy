; Development project for the host library itself: native unit tests against a
; simulated fader. Not part of the published package (see library.json export).
;
;   pio test -d hostLib -e native
;
; The Arduino example is compile-checked separately, as a consumer would build it:
;
;   pio ci hostLib/examples/basic --lib hostLib --board esp32dev

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -Werror
    -Wno-unused-parameter
