; PlatformIO Project Configuration File

[env:lilygo-t-display]
platform = espressif32@6.12
board = esp32dev
framework = arduino

; Regenerate the embedded *current* FaderBuddy application image
; (include/fader_app_image.h) before every build, so the production test's
; I2C-bootloader firmware-install step always streams the up-to-date app.
; See tools/generate_app_image.py and BOOTLOADER_NEXT.md P0.
extra_scripts = pre:tools/pre_embed_app_image.py

lib_deps =
    madhephaestus/ESP32Servo @ 3.0.9
    adafruit/Adafruit INA3221 Library @ 1.0.1
    bodmer/TFT_eSPI @ 2.5.43
; build_src_filter = +<*> -<.git/> +<../../firmware/src/shared/>
build_flags =
    -I../../firmware/src/shared
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=135
    -DTFT_HEIGHT=240
    -DTFT_MOSI=19
    -DTFT_SCLK=18
    -DTFT_CS=5
    -DTFT_DC=16
    -DTFT_RST=23
    -DTFT_BL=4
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=40000000
board_build.filesystem = littlefs
board_build.partitions = default.csv
monitor_speed = 115200
upload_port = /dev/serial/by-id/usb-Silicon_Labs_CP2104_USB_to_UART_Bridge_Controller_02280A9E-if00-port0

; ===========================================================================
; Standalone bootloader test build: same jig hardware, but instead of the full
; production test sequence it *only* streams the embedded FaderBuddy offset-app
; image to a fader over I2C via the bootloader and verifies it (press the
; presence switch to run). Useful for isolated bring-up/debugging of the I2C
; bootloader path without running the whole test suite. The embedded image is
; regenerated by the pre_embed_app_image.py hook inherited from env:lilygo-t-display.
;   pio run -e bootloader_test -t upload
; The fader under test must already have the bootloader installed via UPDI.
; (The full production env, env:lilygo-t-display, now also exercises the I2C
; bootloader as part of TEST_FIRMWARE_INSTALL -- see BOOTLOADER_NEXT.md P0.)
; ===========================================================================
[env:bootloader_test]
extends = env:lilygo-t-display
build_flags =
    ${env:lilygo-t-display.build_flags}
    -DBOOTLOADER_TEST_MODE
